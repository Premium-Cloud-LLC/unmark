name: Unmark
options:
  bundleIdPrefix: com.unmark
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  Down:
    url: https://github.com/johnxnguyen/Down
    from: "0.11.0"

targets:
  Unmark:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.unmark.Unmark
        CODE_SIGN_ENTITLEMENTS: Resources/Unmark.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # ----- DEVELOPMENT signing (current) -----
        # Used for local builds via run.sh. Ad-hoc signed; cannot be distributed.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        # ----- PRODUCTION signing (uncomment when distributing) -----
        # Once you have your Apple Developer Team ID and a Developer ID
        # Application certificate installed in Keychain, comment OUT the two
        # lines above and uncomment these three:
        #
        # DEVELOPMENT_TEAM: YOUR10CHARID
        # CODE_SIGN_STYLE: Manual
        # CODE_SIGN_IDENTITY: "Developer ID Application"
        #
        # Then re-run: xcodegen generate
    dependencies:
      - package: Down
    info:
      path: Resources/Info.plist
      properties:
        LSUIElement: YES
        CFBundleName: Unmark
        CFBundleDisplayName: Unmark
        NSHumanReadableCopyright: "© 2026 Unmark"
        LSMinimumSystemVersion: "13.0"
